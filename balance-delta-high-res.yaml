                                nullable: true
                              min_downw_regulation_price:
                                type: string
                                example: "-182.53"
                                nullable: true
                              mid_price:
                                type: string
                                example: "22.69"
                                nullable: true
                            required:
                              - timeInterval_start
                              - timeInterval_end
                              - sequence
                      required:
                        - timeInterval
                        - points
                required:
                  - mRID
                  - quantity_Measurement_Unit_name
                  - currency_Unit_name
