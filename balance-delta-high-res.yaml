                                example: "163.0"
                                nullable: true
                              power_igcc_in:
                                type: string
                                example: "0.0"
                                nullable: true
                              power_igcc_out:
                                type: string
                                example: "1.0"
                                nullable: true
                              power_mfrrda_in:
                                type: string
                                example: "5.0"
                                nullable: true
                              power_mfrrda_out:
                                type: string
                                example: "2.0"
                                nullable: true
                              power_picasso_in:
                                type: string
                                example: "2.0"
                                nullable: true
                              power_picasso_out:
                                type: string
                                example: "6.0"
                                nullable: true
                              power_mari_in:
                                type: string
                                example: "1.0"
                                nullable: true
                              power_mari_out:
                                type: string
                                example: "4.0"
                                nullable: true
                              max_upw_regulation_price:
                                type: string
