                properties:
                  mRID:
                    type: integer
                    example: 1
                  quantity_Measurement_Unit_name:
                    type: string
                    example: "MAW"
                  currency_Unit_name:
                    type: string
                    example: "EUR"
                  Period:
                    type: array
                    items:
                      type: object
                      properties:
                        timeInterval:
                          type: object
                          properties:
