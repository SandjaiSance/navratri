openapi: '3.0.3'
info:
  title: Aether - Balance Delta High resolution
  description: |
    **API Usage Instructions:**  
    
    **Recommended approach:**  
    •  Use the "/publications/v1/balance-delta-high-res/latest" endpoint.  
    •  Poll the endpoint five times per minute, one second after each data-refresh event on the 12th second
          (for example: 00:00:13, 00:00:25, 00:00:37, 00:00:49, and 00:01:01).  
    •  Responses return the most recent available 30 minutes, subject to a configurable delay imposed by TenneT.  
    •  All timestamps are provided in UTC.  
    •  Response format: JSON.
    
    **Back-up approach to retrieve missed data:**    
    •  Use the "/publications/v1/balance-delta-high-res" endpoint.  
    •  Poll the endpoint max. 8 times per 24H starting from 00:00 UTC with a maximum period of 4 hours. In case you would like to compile a complete data file of 24 hours, we advise to call for 00:00 – 04:00; 04:00 – 08:00; etc.   
    •  Time stamps are provided in UTC or Local depending on the used parameter.  
    •  Response format: JSON, CSV, XML, XSLX depending on the used parameter.  

    **Backfilling your historical dataset (large quantities of data):**    
    •  An option will be available on [https://www.tennet.eu/nl-en/grids-and-markets/transparency-data-netherlands/download-page-transparency](https://www.tennet.eu/nl-en/grids-and-markets/transparency-data-netherlands/download-page-transparency) to manually download your large dataset at once (up to 100 MB)

    **note: This API is subject to rate limiting see endpoints**  
    Exceeding these limits may result in temporary blocking of your API keys. Please ensure your usage adheres to these limits to maintain uninterrupted access.
    

  version: 1.6.0
servers:
  - url: https://{environment}.tennet.eu
    variables:
      environment:
        default: api.acc
        enum:
          - api
          - api.acc
paths:
  /publications/v1/balance-delta-high-res/latest:
    get:
      tags:
       - Balance Delta High Res
      summary: Get Balance Delta high res latest data
      description: | 
                    **Use this as a standard method to retrieve the balance delta high res data**
                    
                    The following rate limits apply:  
                    
                    **Production**
                      - Maximum requests per second: 1
                      - Maximum requests per minute: 10

                    **Acceptance**
                     - Maximum requests per second: 1
                     - Maximum requests per minute: 10

      operationId: request_get_latest
      parameters:
        - name: Accept
          in: header
          description: "The response type is the format of the returned answer."
          required: true
          schema:
            type: string
            example: "application/json"
            default: application/json 
            enum:
              - application/json
              - application/xml
              - text/csv
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/response_json'
                  - $ref: '#/components/schemas/no-data'
            application/xml:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/response_xml'
                  - $ref: '#/components/schemas/no-data'
            text/csv:
              schema:
                $ref: '#/components/schemas/response_csv'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          description: No valid API key found in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-apikey'
        '405':
          description: This Method is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-method'
        '422':
          description: Missing information, e.g. date range or type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-missing-information'
        '429':
          description: Rate Limit Reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-rate-limit'
        '503':
          description: This service is temporarily unavailable due to maintenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-maintenance'
      security:
        - apikey:
            - read:data
  /publications/v1/balance-delta-high-res:
    get:
      tags:
       - Balance Delta High Res
      summary: Get Balance Delta high res data by timeframe
      description: | 
                    **Use this as a back up method. The maximum period is 4 hours.**
                    
                    The following rate limits apply:
                    
                    **Production**
                      - Maximum requests per day: 8
                      
                    **Acceptance**
                     - Maximum requests per day: 8 

      operationId: request_balance_delta_high_res
      parameters:
        - name: date_from
          in: query
          description: "The start date and time of the requested time frame. Use datetime with Z for UTC (format: dd-mm-yyyy hh:mm:ssZ)."
          required: true
          schema:
            type: string
            pattern: '^\d{2}-\d{2}-\d{4} \d{2}:\d{2}:\d{2}Z$'
            example: "13-01-2025 00:00:00Z"
        - name: date_to
          in: query
          description: "The end date and time of the requested time frame, maximum range is 4 hours. Use same timezone as date_from (format: dd-mm-yyyy hh:mm:ssZ)."
          required: true
          schema:
            type: string
            pattern: '^\d{2}-\d{2}-\d{4} \d{2}:\d{2}:\d{2}Z$'
            example: "13-01-2025 00:04:00Z"
        - name: Accept
          in: header
          description: "The response type is the format of the returned answer."
          required: true
          schema:
            type: string
            enum:
              - application/json
              - application/xml
              - text/csv
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            example: "application/json"
            default: application/json 
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/response_json'
                  - $ref: '#/components/schemas/no-data'
            application/xml:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/response_xml'
                  - $ref: '#/components/schemas/no-data'
            text/csv:
              schema:
                $ref: '#/components/schemas/response_csv'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          description: No valid API key found in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-apikey'
        '405':
          description: This Method is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-method'
        '422':
          description: Missing information, e.g. date range or type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-missing-information'
        '429':
          description: Rate Limit Reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-rate-limit'
        '503':
          description: This service is temporarily unavailable due to maintenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-maintenance'
      security:
        - apikey:
            - read:data

components:
  schemas:
